server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 320m;

    location /api/ {
        proxy_pass http://backend:8012;
        proxy_set_header Host $host;
    }
    location /health {
        proxy_pass http://backend:8012;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
